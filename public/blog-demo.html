<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AI 부동산 블로그 자동 작성 (데모)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="사진 등록부터 네이버 블로그용 복사까지 전 과정을 휴대폰에서 체험하는 AI 부동산 블로그 데모입니다." />
<meta name="theme-color" content="#7C3AED" />
<style>
  :root{
    color-scheme: light;
    --bg:#FBFAFF; --frame:#EDE9F7; --card:#FFFFFF; --lav:#F3EEFF; --lav2:#F7F4FF;
    --violet:#7C3AED; --violet-d:#5B21B6; --violet-line:#E3D9FB;
    --green:#16A34A; --green-d:#15803D; --green-lav:#EAF7EF;
    --ink:#2E2A3A; --muted:#6B6780; --faint:#9B95AD;
    --amber:#D97706;
    --radius:18px;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
      "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--frame);}
  body{font-family:var(--font); color:var(--ink); display:flex; justify-content:center; min-height:100dvh; line-height:1.5;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea{font-family:inherit; font-size:15px;}
  img{display:block; max-width:100%;}

  .app{width:100%; max-width:460px; background:var(--bg); min-height:100dvh; display:flex; flex-direction:column;
       box-shadow:0 20px 60px -30px rgba(60,20,120,.35); position:relative;}

  /* header */
  .hdr{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
       border-bottom:1px solid var(--violet-line); padding:12px 16px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .logo{width:32px; height:32px; border-radius:11px; background:var(--violet); color:#fff; display:grid; place-items:center; font-size:17px;}
  .brand b{font-size:15px; font-weight:800; letter-spacing:-.02em;}
  .brand .sub{font-size:11px; color:var(--violet); margin-top:1px;}
  .chip-btn{border:1px solid var(--violet-line); color:var(--violet); font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; background:#fff;}

  main{flex:1; padding:16px 16px 92px;}
  .stack{display:flex; flex-direction:column; gap:16px;}

  /* cards & type */
  .card{background:var(--card); border:1px solid var(--violet-line); border-radius:var(--radius); padding:16px; box-shadow:0 4px 16px -10px rgba(90,33,182,.25);}
  h2.sec{font-size:18px; font-weight:800; letter-spacing:-.02em;}
  .sec-row{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px;}
  .step-num{flex:0 0 auto; width:28px; height:28px; border-radius:999px; background:var(--violet); color:#fff; font-weight:800; font-size:14px; display:grid; place-items:center; margin-top:1px;}
  .sec-desc{font-size:13px; color:var(--muted); margin-top:2px;}
  .muted{color:var(--muted);} .faint{color:var(--faint);}

  /* buttons */
  .btn{width:100%; border-radius:16px; padding:15px; font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .06s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--violet); color:#fff; box-shadow:0 10px 24px -10px rgba(124,58,237,.7);}
  .btn-primary:disabled{background:#CFC8DE; box-shadow:none; cursor:not-allowed;}
  .btn-green{background:var(--green); color:#fff; box-shadow:0 10px 24px -10px rgba(22,163,74,.6);}
  .btn-ghost{background:#fff; border:1px solid var(--violet-line); color:var(--violet); font-weight:700; padding:13px; font-size:15px;}
  .btn-ghost.green{border-color:#BBE7C8; color:var(--green-d);}
  .btn-ghost.slate{border-color:#D9D5E4; color:var(--muted);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

  /* chips */
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{border:1px solid var(--violet-line); background:#fff; color:var(--violet-d); font-size:13px; font-weight:600; padding:7px 13px; border-radius:999px; transition:transform .06s;}
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--violet); color:#fff; border-color:var(--violet);}
  .type-row{display:flex; gap:7px;}
  .type-btn{flex:1; border:2px solid var(--violet-line); background:#fff; color:var(--violet); font-weight:800; font-size:15px; padding:12px 4px; border-radius:14px; transition:transform .06s;}
  .type-btn:active{transform:scale(.96);}
  .type-btn.on{background:var(--violet); color:#fff; border-color:var(--violet);}

  /* fields */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .fld{display:flex; flex-direction:column; gap:5px;}
  .fld.wide{grid-column:span 2;}
  .fld label{font-size:12.5px; font-weight:700; color:var(--muted);}
  .fld input, .txt{border:1px solid var(--violet-line); border-radius:12px; padding:11px; color:var(--ink); background:#fff; outline:none; width:100%;}
  .fld input:focus, .txt:focus{border-color:var(--violet); box-shadow:0 0 0 3px var(--lav);}
  .label{font-size:12.5px; font-weight:700; color:var(--muted);}

  /* photos */
  .up-row{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .up-btn{border:2px dashed var(--violet-line); background:var(--lav2); color:var(--violet); border-radius:16px; padding:20px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:700; font-size:14px;}
  .thumbs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px;}
  .thumb{position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; border:2px solid var(--violet-line);}
  .thumb.cover{border-color:var(--violet);}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .thumb .badge{position:absolute; left:4px; top:4px; background:var(--violet); color:#fff; font-size:10px; font-weight:800; padding:2px 6px; border-radius:6px;}
  .thumb .lab{position:absolute; left:4px; bottom:4px; background:rgba(0,0,0,.55); color:#fff; font-size:10px; font-weight:600; padding:2px 6px; border-radius:5px;}
  .thumb .tr{position:absolute; right:4px; top:4px; display:flex; gap:4px;}
  .thumb .br{position:absolute; right:4px; bottom:4px; display:flex; gap:4px;}
  .icobtn{background:rgba(255,255,255,.9); border-radius:7px; width:24px; height:24px; display:grid; place-items:center; font-size:13px;}
  .icobtn.red{color:#dc2626;} .icobtn.v{color:var(--violet);}
  .icobtn:disabled{opacity:.3;}

  /* step bar */
  .stepbar{display:flex; align-items:flex-start; justify-content:space-between; padding:2px 0 4px;}
  .stepcell{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;}
  .stepline{display:flex; align-items:center; width:100%;}
  .stepline .l{height:3px; flex:1; border-radius:3px; background:var(--violet-line);}
  .stepline .l.fill{background:var(--violet);}
  .stepline .l.hide{opacity:0;}
  .dot{flex:0 0 auto; width:24px; height:24px; border-radius:999px; background:var(--lav); color:var(--faint); font-size:11px; font-weight:800; display:grid; place-items:center;}
  .dot.done{background:var(--violet); color:#fff;}
  .dot.now{background:var(--violet); color:#fff; box-shadow:0 0 0 4px var(--lav);}
  .steplabel{font-size:10px; font-weight:700; color:var(--faint);}
  .steplabel.now{color:var(--violet-d);}

  /* hero (home) */
  .hero{border-radius:24px; padding:22px; color:#fff; background:linear-gradient(135deg,var(--violet) 0%, var(--violet-d) 100%); box-shadow:0 18px 40px -18px rgba(91,33,182,.6);}
  .hero h1{font-size:22px; font-weight:900; letter-spacing:-.03em; line-height:1.2;}
  .hero p{font-size:13.5px; color:#EBE3FF; margin-top:4px;}
  .checks{list-style:none; margin-top:14px; display:flex; flex-direction:column; gap:6px;}
  .checks li{display:flex; gap:7px; font-size:12.5px; color:#EDE7FF;}
  .checks .ck{color:#8AF0AE; font-weight:900;}
  .flow{display:flex; align-items:center; justify-content:space-between;}
  .flow .f{display:flex; flex-direction:column; align-items:center; gap:5px; width:56px;}
  .flow .fic{width:44px; height:44px; border-radius:14px; background:var(--lav); color:var(--violet); display:grid; place-items:center; font-size:20px;}
  .flow .fl{font-size:10px; color:var(--muted); font-weight:600; text-align:center; line-height:1.2;}
  .flow .arr{color:#C9BEF0; font-size:13px;}
  .cta-card{background:#fff; border:1px solid var(--violet-line); border-radius:24px; padding:22px; text-align:center; box-shadow:0 6px 20px -12px rgba(90,33,182,.3);}
  .cta-card h2{font-size:20px; font-weight:900; letter-spacing:-.02em;}
  .cta-card p{font-size:13.5px; color:var(--muted); margin-top:6px;}

  /* record row */
  .rec{display:flex; align-items:center; gap:11px; background:#fff; border:1px solid var(--violet-line); border-radius:16px; padding:10px;}
  .rec .th{flex:0 0 auto; width:54px; height:54px; border-radius:12px; object-fit:cover; background:var(--lav); display:grid; place-items:center; color:#C4B8E8; font-size:20px;}
  .rec .body{flex:1; min-width:0;}
  .rec .tt{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rec .meta{display:flex; align-items:center; gap:6px; margin-top:3px;}
  .tag{font-size:10px; font-weight:800; padding:2px 7px; border-radius:7px;}
  .tag.done{background:var(--green-lav); color:var(--green-d);}
  .tag.draft{background:#FDF0D9; color:var(--amber);}
  .tag.type{background:var(--lav); color:var(--violet);}
  .rec .sub{font-size:11px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rec .acts{display:flex; flex-direction:column; gap:5px;}
  .rec .acts button{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:15px;}

  /* preview blog */
  .post{background:#fff; border:1px solid var(--violet-line); border-radius:20px; overflow:hidden; box-shadow:0 6px 20px -12px rgba(90,33,182,.3);}
  .post .cover{width:100%; height:200px; object-fit:cover;}
  .post .in{padding:16px; display:flex; flex-direction:column; gap:15px;}
  .post h1{font-size:20px; font-weight:900; letter-spacing:-.02em; line-height:1.3;}
  .post p.para{font-size:15px; line-height:1.7; color:#3a3550; white-space:pre-wrap;}
  .infobox{background:var(--lav2); border-radius:14px; padding:14px;}
  .infobox .h{font-size:14px; font-weight:800; color:var(--violet-d); margin-bottom:8px;}
  .inforow{display:flex; font-size:14px; padding:2px 0;}
  .inforow dt{width:78px; flex:0 0 auto; color:var(--muted);}
  .inforow dd{font-weight:600;}
  .sect h3{font-size:15px; font-weight:800; margin-bottom:6px;}
  .sect img{border-radius:12px; height:150px; width:100%; object-fit:cover; margin-bottom:6px;}
  .recbox{background:var(--lav2); border-radius:14px; padding:14px;}
  .recbox li{font-size:14px; color:#3a3550; list-style:none; padding:2px 0;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; border-top:1px solid var(--lav); padding-top:12px;}
  .tags span{font-size:13px; color:var(--violet);}

  .title-pick{display:flex; flex-direction:column; gap:8px;}
  .title-opt{display:flex; align-items:flex-start; gap:9px; text-align:left; border:1px solid var(--violet-line); background:#fff; border-radius:12px; padding:11px; font-size:15px; font-weight:600;}
  .title-opt.on{border-color:var(--violet); background:var(--lav);}
  .radio{flex:0 0 auto; width:16px; height:16px; border-radius:999px; border:2px solid #cfc7e3; margin-top:2px;}
  .title-opt.on .radio{border-color:var(--violet); background:var(--violet);}

  /* complete */
  .done-banner{border-radius:22px; padding:26px 20px; text-align:center; color:#fff; background:linear-gradient(180deg,#22C55E,var(--green)); box-shadow:0 16px 36px -16px rgba(22,163,74,.6);}
  .done-banner .ic{width:64px; height:64px; margin:0 auto 12px; border-radius:18px; background:rgba(255,255,255,.2); display:grid; place-items:center; font-size:34px;}
  .done-banner h2{font-size:20px; font-weight:900;}
  .done-banner p{font-size:13px; color:#E7FBEE; margin-top:4px;}
  .notice{border:1px solid #BBE7C8; background:var(--green-lav); color:#166534; border-radius:12px; padding:11px 13px; font-size:13px; line-height:1.6;}

  /* style radio list */
  .stylelist{display:flex; flex-direction:column; gap:8px;}
  .stylerow{display:flex; align-items:center; justify-content:space-between; border:1px solid var(--violet-line); background:#fff; border-radius:12px; padding:12px 14px; text-align:left;}
  .stylerow.on{border-color:var(--violet); background:var(--lav);}
  .stylerow .st{font-size:15px; font-weight:800;}
  .stylerow .sd{font-size:12px; color:var(--muted);}
  .stylerow .rd{width:16px; height:16px; border-radius:999px; border:2px solid #cfc7e3;}
  .stylerow.on .rd{border-color:var(--violet); background:var(--violet);}

  /* plans */
  .plan{background:#fff; border:2px solid var(--violet-line); border-radius:18px; padding:18px;}
  .plan.hot{border-color:var(--violet);}
  .plan .top{display:flex; align-items:center; justify-content:space-between;}
  .plan .nm{font-size:18px; font-weight:900;}
  .plan .pr{font-size:20px; font-weight:900; color:var(--violet);}
  .plan .pr small{font-size:12px; color:var(--faint); font-weight:600;}
  .plan .q{font-size:13px; font-weight:700; color:var(--muted); margin-top:2px;}
  .plan ul{list-style:none; margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .plan li{font-size:13.5px; color:#3a3550; display:flex; gap:7px;}
  .plan li .ck{color:var(--green);}
  .plan .disabled{margin-top:14px; width:100%; border:1px solid var(--violet-line); background:var(--lav); color:#B3A8D2; padding:11px; border-radius:12px; font-weight:800; font-size:14px;}
  .badge-hot{background:var(--violet); color:#fff; font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px;}

  /* empty */
  .empty{border:2px dashed var(--violet-line); background:#fff; border-radius:18px; padding:44px 16px; text-align:center; color:var(--faint);}

  /* bottom nav */
  nav{position:fixed; bottom:0; left:0; right:0; margin:0 auto; max-width:460px; background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-top:1px solid var(--violet-line); z-index:30;
      display:grid; grid-template-columns:repeat(5,1fr); padding-bottom:env(safe-area-inset-bottom);}
  nav button{padding:9px 0; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--faint); font-size:19px;}
  nav button .nl{font-size:10px; font-weight:700;}
  nav button.on{color:var(--violet);}
  nav .newbtn{padding:6px 0;}
  nav .newbtn .plus{margin-top:-16px; width:48px; height:48px; border-radius:16px; background:var(--violet); color:#fff; display:grid; place-items:center; font-size:24px; box-shadow:0 10px 20px -8px rgba(124,58,237,.7);}
  nav .newbtn .nl{color:var(--violet);}

  .settings-fab{position:fixed; right:16px; bottom:88px; z-index:20; width:44px; height:44px; border-radius:999px; background:#fff; border:1px solid var(--violet-line); color:var(--violet); display:grid; place-items:center; font-size:19px; box-shadow:0 6px 16px -8px rgba(90,33,182,.4);}

  .fixed-cta{position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:460px; z-index:25; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-top:1px solid var(--violet-line);}

  .back-link{width:100%; padding:9px; text-align:center; font-size:14px; font-weight:600; color:var(--faint);}

  /* toast */
  #toast{position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-20px); z-index:100; background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; opacity:0; transition:.25s; pointer-events:none; max-width:88%;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast.err{background:#B91C1C;} #toast.ok{background:var(--green-d);}

  .spin{width:20px; height:20px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:999px; animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none;} .btn:active,.chip:active,.type-btn:active{transform:none;} }

  .demo-flag{font-size:11px; color:var(--faint); text-align:center; padding:2px 0 0;}
  textarea.edit{border:1px solid var(--violet-line); border-radius:12px; padding:10px; width:100%; line-height:1.6; color:var(--ink); outline:none; resize:vertical;}
  textarea.edit:focus{border-color:var(--violet); box-shadow:0 0 0 3px var(--lav);}
</style>
</head>
<body>

<div class="app">
  <header class="hdr">
    <button class="brand" onclick="go('home')">
      <span class="logo">🏠</span>
      <span style="text-align:left; line-height:1.1">
        <b>AI 부동산 블로그</b><br><span class="sub">스마트 홍보 시스템</span>
      </span>
    </button>
    <button class="chip-btn" onclick="go('subscription')">요금제</button>
  </header>
  <main id="view"></main>
  <button class="settings-fab" id="fab" onclick="go('settings')">⚙️</button>
  <nav id="nav"></nav>
</div>
<div id="toast"></div>

<script>
/* ============ 상수 ============ */
const TYPES = ["매매","전세","월세","단기","임대"];
const PRICE_FIELDS = { 매매:["매매가"], 전세:["전세가"], 월세:["월세보증금","월세"], 단기:["월세보증금","월세"], 임대:["월세보증금","월세"] };
const PRICE_LABEL = { 매매가:"매매가", 전세가:"전세가", 월세보증금:"보증금", 월세:"월세" };
const COMMON = [
  ["아파트명","예: 힐스테이트"],["주소","예: 대구 수성구 범어동", true],["동/층","예: 101동 15층"],
  ["전용면적","㎡"],["공급면적","㎡"],["평수","예: 25.7"],["방개수","예: 3"],["욕실개수","예: 2"],
  ["관리비","예: 12만원"],["방향","예: 남향"],["주차","예: 세대당 1.5대"],["준공년도","예: 2019"],
];
const CONTACT = [["중개사무소명","예: 범어공인중개사", true],["담당자명","예: 홍길동 실장"],["연락처","예: 010-0000-0000"]];
const MOVEIN = ["즉시입주","협의가능","1개월 이내","날짜 지정"];
const FEATURE_GROUPS = [
  ["방향·층", ["남향","남동향","남서향","동향","고층","중층","저층","로열동","로열층"]],
  ["상태·구조", ["올수리","부분수리","신축급","확장형","시스템에어컨","붙박이장","팬트리","드레스룸"]],
  ["뷰·환경", ["뷰 좋음","일조량 좋음","조용함","숲세권","공원 인접"]],
  ["입지·생활", ["역세권","학세권","생활권 좋음","대형마트 인접","병원 인접"]],
  ["기타", ["즉시입주","애완동물 협의"]],
];
const STYLES = [
  ["전문적인소장님","전문적인 소장님","신뢰감 있는 전문 어조"],
  ["친절한실장님","친절한 실장님","따뜻하고 다정한 안내 (기본)"],
  ["고급아파트홍보","고급 아파트 홍보","세련된 프리미엄 어조"],
  ["깔끔한정보형","깔끔한 정보형","핵심만 간결하게"],

/* ============ 상태 / 저장 ============ */
const KEY="blogdemo_records_v1";
let S = { screen:"home", step:"edit", current:null, records:load(), busy:false, editing:false };
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S.records)); }catch(e){} }
function uid(){ return "p_"+Date.now().toString(36)+"_"+Math.floor(Math.random()*1e6).toString(36); }

function emptyInfo(){ const o={}; ["아파트명","주소","동/층","전용면적","공급면적","평수","방개수","욕실개수","매매가","전세가","월세보증금","월세","관리비","입주가능일","방향","주차","준공년도","중개사무소명","담당자명","연락처"].forEach(k=>o[k]=""); return o; }
function emptyRecord(){ return { id:uid(), createdAt:Date.now(), status:"draft", transactionType:"전세", info:emptyInfo(), features:[], moveInMode:"", photos:[], coverPhotoId:null, style:"친절한실장님", length:"보통", blog:null, titleIdx:0, variant:0 }; }

function saveCurrent(){ if(!S.current) return; const i=S.records.findIndex(r=>r.id===S.current.id); if(i>=0) S.records[i]=S.current; else S.records.unshift(S.current); persist(); }
function patch(p){ if(!S.current) return; Object.assign(S.current, p); saveCurrent(); }

/* ============ 내비게이션 ============ */
function go(scr){ S.screen=scr; if(scr!=="editor") S.editing=false; render(); window.scrollTo(0,0); }
function startNew(){ S.current=emptyRecord(); S.step="edit"; S.screen="editor"; render(); window.scrollTo(0,0); }
function openRecord(id){ const r=S.records.find(x=>x.id===id); if(!r) return; S.current=JSON.parse(JSON.stringify(r)); S.step = r.status==="done"?"complete":(r.blog?"preview":"edit"); S.screen="editor"; render(); window.scrollTo(0,0); }
function copyRecord(id){ const r=S.records.find(x=>x.id===id); if(!r) return; const c=JSON.parse(JSON.stringify(r)); c.id=uid(); c.createdAt=Date.now(); c.status="draft"; c.photos=[]; c.coverPhotoId=null; c.blog=null; c.titleIdx=0; S.current=c; S.step="edit"; S.screen="editor"; render(); toast("정보를 복사했어요. 사진만 새로 올리면 돼요.","ok"); window.scrollTo(0,0); }
function delRecord(id){ if(!confirm("이 매물을 삭제할까요?")) return; S.records=S.records.filter(r=>r.id!==id); persist(); render(); }

/* ============ 토스트 ============ */
let toastT;
function toast(msg,kind){ const t=document.getElementById("toast"); t.textContent=msg; t.className="show"+(kind?(" "+kind):""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="",2200); }

/* ============ 유틸 ============ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function cover(rec){ if(!rec.photos.length) return null; const c=rec.photos.find(p=>p.id===rec.coverPhotoId); return (c||rec.photos[0]).dataUrl; }
function num(v){ return String(v||"").replace(/[^0-9.]/g,""); }

/* 사진 리사이즈 → dataURL */
function fileToDataUrl(file, max=1200){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{ const s=Math.min(1, max/Math.max(img.width,img.height)); const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL("image/jpeg",.85)); URL.revokeObjectURL(img.src); };
    img.onerror=()=>res(null);
    img.src=URL.createObjectURL(file);
  });
}
</script>

<script>

  ];

  /* 현장 설명 */

  if((parseInt(i.욕실개수)||0)>=2 || f.includes("올수리")) sec.push({room:"욕실", text:`욕실은 ${renovated?"깔끔하게 수리되어 ":""}관리 상태가 좋고, 건식·습식 사용이 모두 편리합니다.`});
  if(f.includes("확장형")||f.includes("뷰 좋음")) sec.push({room:"베란다", text:`베란다는 ${f.includes("확장형")?"확장되어 실내가 한층 넓게 쓰이고, ":""}${f.includes("뷰 좋음")?"창밖 조망이 시원하게 열려 있습니다.":"채광과 통풍이 좋습니다."}`});

  /* 추천 */

/* 승인/미리보기용 핵심정보 라인 */
function coreInfo(rec){
  const i=rec.info, out=[["거래 유형", rec.transactionType]];
  const push=(l,k)=>{ if(i[k]&&i[k].trim()) out.push([l,i[k]]); };
  push("아파트","아파트명"); push("주소","주소"); push("동/층","동/층");
  const area=[i.전용면적&&i.전용면적+"㎡", i.평수&&i.평수+"평"].filter(Boolean).join(" / "); if(area) out.push(["면적",area]);
  const rb=[i.방개수&&i.방개수+"룸", i.욕실개수&&i.욕실개수+"욕실"].filter(Boolean).join(" / "); if(rb) out.push(["방/욕실",rb]);
  (PRICE_FIELDS[rec.transactionType]||[]).forEach(k=>push(PRICE_LABEL[k],k));
  push("관리비","관리비"); push("입주","입주가능일"); push("방향","방향"); push("주차","주차"); push("준공","준공년도");
  return out;
}
function selTitle(rec){ const t=(rec.blog&&rec.blog.titles)||[]; if(!t.length) return rec.info.아파트명||"매물 소개"; return t[Math.min(rec.titleIdx,t.length-1)]; }

function buildText(rec){
  const b=rec.blog; if(!b) return "";
  const L=[selTitle(rec),""];
  if(b.intro) L.push(b.intro,"");
  L.push("🏠 매물 정보"); coreInfo(rec).forEach(([l,v])=>L.push(l+" : "+v)); L.push("");
  if(b.sections.length){ L.push("📸 현장 설명"); b.sections.forEach(s=>L.push("["+s.room+"]",s.text,"")); }
  if(b.recommendations.length){ L.push("✨ 이런 분께 추천합니다"); b.recommendations.forEach(r=>L.push("· "+r)); L.push(""); }
  if(b.closing) L.push(b.closing,"");
  if(rec.info.담당자명) L.push("☎ 담당자 : "+rec.info.담당자명);
  if(rec.info.연락처) L.push("☎ 연락처 : "+rec.info.연락처);
  if(rec.info.담당자명||rec.info.연락처) L.push("");
  if(b.hashtags.length) L.push(b.hashtags.join(" "));
  return L.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

/* 클립보드 (iframe 대응 fallback 포함) */
function copyText(text,label){
  const done=()=>toast((label||"글")+"을(를) 복사했어요.","ok");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("복사가 막혀 있어요. 길게 눌러 복사해 주세요.","err"); }
  document.body.removeChild(ta);
}
</script>

<script>

function render(){
  const v=document.getElementById("view");

  fab.style.display = (S.screen==="editor"||S.screen==="settings") ? "none":"grid";
  let html="";
  if(S.screen==="home") html=Home();
  else if(S.screen==="editor") html = S.step==="preview"?Preview() : S.step==="complete"?Complete() : Editor();
  else if(S.screen==="drafts") html=List("draft");
  else if(S.screen==="done") html=List("done");
  else if(S.screen==="blogs") html=List("all");
  else if(S.screen==="settings") html=Settings();
  else if(S.screen==="subscription") html=Subscription();
  v.innerHTML=html;
  const nav=document.getElementById("nav");
  const hideNav = (S.screen==="editor" && S.step==="edit");
  nav.style.display = hideNav ? "none" : "grid";
  nav.innerHTML=Nav();
}

function Nav(){
  const items=[["home","🏠","홈"],["drafts","🕓","작성중"],["__new","＋","새 매물"],["done","✅","완료"],["blogs","📄","내 글"]];
  return items.map(([s,ic,l])=>{
    if(s==="__new") return `<button class="newbtn" onclick="startNew()"><span class="plus">${ic}</span><span class="nl">${l}</span></button>`;
    const on = S.screen===s ? "on":"";
    return `<button class="${on}" onclick="go('${s}')"><span>${ic}</span><span class="nl">${l}</span></button>`;
  }).join("");
}

function StepBar(cur){
  const labels=["사진 촬영","AI 작성","미리보기","승인","업로드"];
  return `<div class="stepbar">`+labels.map((l,i)=>{
    const done=i<cur, now=i===cur;
    const lc = i===0?"hide":(done||now?"fill":"");
    const rc = i===labels.length-1?"hide":(done?"fill":"");
    const dc = done?"done":now?"now":"";
    return `<div class="stepcell"><div class="stepline"><div class="l ${lc}"></div><div class="dot ${dc}">${done?"✓":(i+1)}</div><div class="l ${rc}"></div></div><div class="steplabel ${now?"now":""}">${l}</div></div>`;
  }).join("")+`</div>`;
}

/* ---- 홈 ---- */
function Home(){
  const recent=S.records.slice(0,3);
  const flow=[["📷","사진 촬영"],["✨","AI 분석·작성"],["👁","미리보기"],["✔","승인"],["✅","블로그 업로드"]];
  return `<div class="stack">
    <div class="hero">
      <h1>AI 부동산 블로그<br>자동 작성</h1>
      <p>사진 한 장으로 끝내는 스마트 홍보 시스템</p>
      <ul class="checks">
        <li><span class="ck">✓</span> 매매 / 전세 / 월세 / 단기 / 임대 지원</li>
        <li><span class="ck">✓</span> 사진 분석 + AI 자동 글 작성</li>
        <li><span class="ck">✓</span> 평수 / 입주가능일 / 특징 자동 정리</li>
        <li><span class="ck">✓</span> 블로그 업로드 지원</li>
      </ul>
    </div>

      <div class="flow">${flow.map((f,i)=>`<div class="f"><div class="fic">${f[0]}</div><div class="fl">${f[1]}</div></div>${i<flow.length-1?'<span class="arr">→</span>':""}`).join("")}</div>

    <div class="cta-card">

    </div>
    ${recent.length?`<div><div style="display:flex; justify-content:space-between; align-items:center; padding:0 4px 8px"><b style="font-size:14px">최근 작업</b><button style="font-size:13px; font-weight:600; color:var(--violet)" onclick="go('blogs')">전체보기</button></div><div class="stack" style="gap:8px">${recent.map(Rec).join("")}</div></div>`:""}

  </div>`;
}

function Rec(r){
  const cv=cover(r), title=r.blog?selTitle(r):(r.info.아파트명||"새 매물");
  const sub=r.info.주소||r.info.아파트명||"";
  return `<div class="rec">
    <div onclick="openRecord('${r.id}')" style="display:flex; flex:1; min-width:0; align-items:center; gap:11px; cursor:pointer">
      ${cv?`<img class="th" src="${cv}">`:`<div class="th">📄</div>`}
      <div class="body">
        <div class="tt">${esc(title)}</div>
        <div class="meta">
          <span class="tag ${r.status==="done"?"done":"draft"}">${r.status==="done"?"완료":"작성중"}</span>
          <span class="tag type">${r.transactionType}</span>
          <span class="sub">${esc(sub)}</span>
        </div>
      </div>
    </div>
    <div class="acts">
      <button class="icobtn v" title="복사" onclick="copyRecord('${r.id}')">⧉</button>
      <button class="icobtn red" title="삭제" onclick="delRecord('${r.id}')">🗑</button>
    </div>
  </div>`;
}

/* ---- 편집(STEP 1~3) ---- */
function Editor(){
  const c=S.current, i=c.info;
  const priceKeys=PRICE_FIELDS[c.transactionType]||[];
  const showCustomDate = c.moveInMode==="날짜 지정" || !MOVEIN.includes(i.입주가능일);
  return `<div class="stack" style="padding-bottom:88px">
    ${StepBar(0)}

    <div class="card">
      <div class="sec-row"><span class="step-num">1</span><div><h2 class="sec">매물 사진 등록</h2><div class="sec-desc">여러 장 올릴 수 있어요 (최대 10장)</div></div></div>
      <div class="up-row">
        <button class="up-btn" onclick="document.getElementById('cam').click()">📷<span>사진 촬영</span></button>
        <button class="up-btn" onclick="document.getElementById('gal').click()">🖼<span>갤러리에서 선택</span></button>
      </div>
      <input id="cam" type="file" accept="image/*" capture="environment" style="display:none" onchange="addPhotos(this.files); this.value=''">
      <input id="gal" type="file" accept="image/*" multiple style="display:none" onchange="addPhotos(this.files); this.value=''">
      ${c.photos.length?`<div class="thumbs">${c.photos.map((p,idx)=>Thumb(p,idx,c)).join("")}</div>`:""}
      <p class="faint" style="font-size:12px; margin-top:8px">별표=대표사진, 화살표=순서변경. 예) ${PHOTO_LABELS.join(" · ")}</p>
    </div>

    <div class="card">
      <div class="sec-row"><span class="step-num">2</span><div><h2 class="sec">거래 정보 입력</h2></div></div>
      <div class="type-row">${TYPES.map(t=>`<button class="type-btn ${c.transactionType===t?"on":""}" onclick="setType('${t}')">${t}</button>`).join("")}</div>
      <div class="grid2" style="margin-top:14px">
        ${priceKeys.map(k=>Fld(k, PRICE_LABEL[k], i[k], "예: 3억 / 5,000")).join("")}
      </div>
      <div class="grid2" style="margin-top:11px">
        ${COMMON.map(([k,ph,wide])=>Fld(k,k,i[k],ph,wide)).join("")}
      </div>
      <div style="margin-top:14px">
        <div class="label">입주 가능일</div>
        <div class="chips" style="margin-top:7px">${MOVEIN.map(m=>`<button class="chip ${c.moveInMode===m?"on":""}" onclick="pickMoveIn('${m}')">${m}</button>`).join("")}</div>
        ${showCustomDate?`<input class="txt" style="margin-top:8px" placeholder="예: 2026-09-01 또는 즉시입주" value="${esc(i.입주가능일)}" oninput="setField('입주가능일',this.value)">`:""}
      </div>
      <div class="grid2" style="margin-top:14px">
        ${CONTACT.map(([k,ph,wide])=>Fld(k,k,i[k],ph,wide)).join("")}
      </div>
    </div>

    <div class="card">
      <div class="sec-row"><div><h2 class="sec">추가 특징</h2><div class="sec-desc">해당하는 것을 눌러 주세요 (선택)</div></div></div>
      <div class="stack" style="gap:12px">
        ${FEATURE_GROUPS.map(([title,items])=>`<div><p style="font-size:12px; font-weight:700; color:var(--violet); margin-bottom:6px">${title}</p><div class="chips">${items.map(f=>`<button class="chip ${c.features.includes(f)?"on":""}" onclick="toggleFeature('${f}')">${f}</button>`).join("")}</div></div>`).join("")}
      </div>
    </div>

    <div class="card">
      <div class="sec-row"><div><h2 class="sec">AI 글 스타일</h2><div class="sec-desc">원하는 어조와 길이를 골라 주세요</div></div></div>
      <div class="stylelist">
        ${STYLES.map(([id,l,d])=>`<button class="stylerow ${c.style===id?"on":""}" onclick="setStyle('${id}')"><div><div class="st">${l}</div><div class="sd">${d}</div></div><span class="rd"></span></button>`).join("")}
      </div>
      <div style="margin-top:14px">
        <div class="label">작성 길이</div>
        <div class="type-row" style="margin-top:7px">${LENGTHS.map(l=>`<button class="type-btn ${c.length===l?"on":""}" onclick="setLength('${l}')">${l}</button>`).join("")}</div>
      </div>
    </div>

    <div class="fixed-cta">
      <button class="btn btn-primary" ${S.busy?"disabled":""} onclick="runAI()">
        ${S.busy?`<span class="spin"></span>${S.busy}`:`✨ AI 자동 작성 시작`}
      </button>
    </div>
  </div>`;
}
function Fld(key,label,val,ph,wide){
  return `<label class="fld ${wide?"wide":""}"><label>${label}</label><input value="${esc(val)}" placeholder="${esc(ph||"")}" oninput="setField('${key}',this.value)"></label>`;
}
function Thumb(p,idx,c){
  const isCover=p.id===c.coverPhotoId;
  return `<div class="thumb ${isCover?"cover":""}">
    <img src="${p.dataUrl}">
    ${isCover?`<span class="badge">대표</span>`:""}
    ${p.label?`<span class="lab">${p.label}</span>`:""}
    <div class="tr">
      <button class="icobtn v" onclick="setCover('${p.id}')" title="대표">${isCover?"★":"☆"}</button>
      <button class="icobtn red" onclick="rmPhoto('${p.id}')" title="삭제">🗑</button>
    </div>
    <div class="br">
      <button class="icobtn" onclick="movePhoto('${p.id}',-1)" ${idx===0?"disabled":""}>‹</button>
      <button class="icobtn" onclick="movePhoto('${p.id}',1)" ${idx===c.photos.length-1?"disabled":""}>›</button>
    </div>
  </div>`;
}

/* ---- 미리보기 ---- */
function Preview(){
  const c=S.current, b=c.blog, cv=cover(c), info=coreInfo(c), ed=S.editing;
  return `<div class="stack">
    ${StepBar(2)}
    <div class="card">
      <p style="font-size:14px; font-weight:800; margin-bottom:8px">제목을 선택하세요</p>
      <div class="title-pick">${b.titles.map((t,idx)=>`<button class="title-opt ${c.titleIdx===idx?"on":""}" onclick="pickTitle(${idx})"><span class="radio"></span>${esc(t)}</button>`).join("")}</div>
    </div>

    <div class="post">
      ${cv?`<img class="cover" src="${cv}">`:""}
      <div class="in">
        <h1>${esc(selTitle(c))}</h1>
        ${ed?ta("intro",b.intro,4):`<p class="para">${esc(b.intro)}</p>`}
        <div class="infobox"><div class="h">🏠 매물 정보</div><dl>${info.map(([l,vv])=>`<div class="inforow"><dt>${l}</dt><dd>${esc(vv)}</dd></div>`).join("")}</dl></div>
        ${b.sections.length?`<div class="stack" style="gap:14px"><p style="font-size:14px; font-weight:800; color:var(--violet-d)">📸 현장 설명</p>${b.sections.map((s,idx)=>{
          const ph=c.photos.find(p=>p.label===s.room);
          return `<div class="sect"><h3>${s.room}</h3>${ph?`<img src="${ph.dataUrl}">`:""}${ed?taSec(idx,s.text,3):`<p class="para">${esc(s.text)}</p>`}</div>`;
        }).join("")}</div>`:""}
        ${b.recommendations.length?`<div class="recbox"><div class="h" style="font-size:14px; font-weight:800; color:var(--violet-d); margin-bottom:6px">✨ 이런 분께 추천합니다</div><ul>${b.recommendations.map(r=>`<li>· ${esc(r)}</li>`).join("")}</ul></div>`:""}
        ${ed?ta("closing",b.closing,3):`<p class="para">${esc(b.closing)}</p>`}
        ${(c.info.담당자명||c.info.연락처)?`<div style="font-size:14px; font-weight:700">${c.info.담당자명?`<div>☎ 담당자 : ${esc(c.info.담당자명)}</div>`:""}${c.info.연락처?`<div>☎ 연락처 : ${esc(c.info.연락처)}</div>`:""}</div>`:""}
        ${b.hashtags.length?`<div class="tags">${b.hashtags.map(h=>`<span>#${esc(h.replace(/^#/,""))}</span>`).join("")}</div>`:""}
      </div>
    </div>

    <div class="row2">
      <button class="btn-ghost btn" onclick="S.editing=!S.editing; render()">✎ ${ed?"수정 완료":"수정하기"}</button>
      <button class="btn-ghost btn slate" ${S.busy?"disabled":""} onclick="regenerate()">${S.busy?`<span class="spin" style="border-top-color:var(--violet)"></span>`:"↻"} AI 다시 작성</button>
    </div>
    <button class="btn btn-green" onclick="approve()">✔ 승인 및 업로드</button>
    <button class="back-link" onclick="S.step='edit'; render()">← 정보 다시 입력하기</button>
  </div>`;
}
function ta(field,val,rows){ return `<textarea class="edit" rows="${rows}" oninput="editBlog('${field}',this.value)">${esc(val)}</textarea>`; }
function taSec(idx,val,rows){ return `<textarea class="edit" rows="${rows}" oninput="editSection(${idx},this.value)">${esc(val)}</textarea>`; }

/* ---- 완료 ---- */
function Complete(){
  const c=S.current, b=c.blog, cv=cover(c), info=coreInfo(c);
  return `<div class="stack">
    <div class="done-banner">
      <div class="ic">✅</div>
      <h2>블로그 홍보글 준비가 완료되었습니다!</h2>
      <p>네이버 블로그에 바로 붙여넣을 수 있어요.</p>
    </div>
    <div class="notice">네이버는 외부 프로그램의 자동 게시를 허용하지 않습니다. 아래 <b>복사</b> 버튼으로 옮겨 <b>붙여넣기</b> 하시면 가장 안전하고 빠릅니다. (자동 로그인·캡차 우회 등은 사용하지 않습니다.)</div>

    <div class="post">
      ${cv?`<img class="cover" style="height:170px" src="${cv}">`:""}
      <div class="in">
        <h1 style="font-size:18px">${esc(selTitle(c))}</h1>
        <p class="para" style="font-size:14px; max-height:66px; overflow:hidden">${esc(b.intro)}</p>
        <div class="infobox" style="background:var(--green-lav)"><dl style="display:grid; grid-template-columns:1fr 1fr; gap:2px 12px">${info.slice(0,8).map(([l,vv])=>`<div class="inforow" style="font-size:13px"><dt style="width:52px">${l}</dt><dd style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(vv)}</dd></div>`).join("")}</dl></div>
        ${b.hashtags.length?`<div class="tags" style="border:none; padding:0">${b.hashtags.slice(0,12).map(h=>`<span style="color:var(--green-d)">#${esc(h.replace(/^#/,""))}</span>`).join("")}</div>`:""}
      </div>
    </div>

    <div class="card">
      <p style="font-size:14px; font-weight:800; margin-bottom:10px">네이버 블로그용 복사</p>
      <div class="row2">
        <button class="btn-ghost btn green" onclick="copyText(buildText(S.current),'전체 글')">⧉ 전체 복사</button>
        <button class="btn-ghost btn green" onclick="copyText(selTitle(S.current),'제목')">⧉ 제목만</button>
        <button class="btn-ghost btn green" onclick="copyText(S.current.blog.hashtags.join(' '),'해시태그')"># 해시태그</button>
        <button class="btn-ghost btn green" onclick="copyText(S.current.photos.map((p,i)=>(i+1)+'. '+(p.label||'사진')+(p.id===S.current.coverPhotoId?' (대표)':'')).join('\\n')||'사진 없음','사진 순서')">▤ 사진 순서</button>
      </div>
      <button class="back-link" onclick="document.getElementById('fulltext').style.display = document.getElementById('fulltext').style.display==='block'?'none':'block'">전체 텍스트 보기 / 접기</button>
      <textarea id="fulltext" class="edit" style="display:none" rows="14" readonly onclick="this.select()">${esc(buildText(c))}</textarea>
    </div>

    <div class="row2">
      <button class="btn-ghost btn" onclick="go('blogs')">📄 내 블로그 글</button>
      <button class="btn btn-primary" onclick="startNew()">＋ 새 매물 작성</button>
    </div>
    <button class="back-link" onclick="go('home')">🏠 홈으로</button>
  </div>`;
}

/* ---- 목록 ---- */
function List(filter){
  const items=S.records.filter(r=> filter==="all"?true:r.status===filter);
  const T={draft:"작성중",done:"완료",all:"내 블로그 글"}, IC={draft:"🕓",done:"✅",all:"📄"};
  return `<div class="stack">
    <div style="display:flex; align-items:center; gap:8px; padding:0 4px"><span style="font-size:20px">${IC[filter]}</span><h2 class="sec">${T[filter]}</h2><span class="tag type" style="font-size:12px">${items.length}</span></div>
    ${items.length? `<div class="stack" style="gap:8px">${items.map(Rec).join("")}</div>`
      : `<div class="empty">📄<div style="margin-top:10px; font-size:14px">아직 없어요.</div><button class="btn btn-primary" style="max-width:200px; margin:16px auto 0" onclick="startNew()">＋ 새 매물 작성</button></div>`}
  </div>`;
}

/* ---- 설정 ---- */
function Settings(){
  const total=S.records.length, done=S.records.filter(r=>r.status==="done").length;
  return `<div class="stack">
    <div style="display:flex; align-items:center; gap:8px; padding:0 4px"><span style="font-size:20px">⚙️</span><h2 class="sec">설정</h2></div>
    <div class="card"><p style="font-weight:800; font-size:14px">사용 현황</p>
      <div class="row2" style="margin-top:12px">
        <div style="background:var(--lav); border-radius:12px; padding:14px; text-align:center"><div style="font-size:26px; font-weight:900; color:var(--violet)">${total}</div><div class="faint" style="font-size:12px">전체 매물</div></div>
        <div style="background:var(--green-lav); border-radius:12px; padding:14px; text-align:center"><div style="font-size:26px; font-weight:900; color:var(--green)">${done}</div><div class="faint" style="font-size:12px">완료된 글</div></div>
      </div>
    </div>
    <div class="card"><p style="font-weight:800; font-size:14px">구독 요금제</p><p class="muted" style="font-size:13px; margin-top:4px">더 많은 매물을 작성하려면 요금제를 확인하세요. (현재는 체험 이용 중)</p><button class="btn-ghost btn" style="margin-top:12px" onclick="go('subscription')">요금제 보기</button></div>
    <div class="card"><p style="font-weight:800; font-size:14px">AI 연결</p><p class="muted" style="font-size:13px; margin-top:4px; line-height:1.6">실제 서비스에서는 AI API 키를 서버 환경변수(LOVABLE_API_KEY)로 안전하게 관리하며 화면에 노출하지 않습니다. 이 데모는 서버 없이 동작하도록 입력값 기반 템플릿으로 글을 생성합니다.</p></div>
    <div class="card"><p style="font-weight:800; font-size:14px">데이터 보관</p><p class="muted" style="font-size:13px; margin-top:4px; line-height:1.6">작성한 매물은 이 브라우저에 저장됩니다. 아래에서 초기화할 수 있어요.</p><button class="btn-ghost btn slate" style="margin-top:12px" onclick="if(confirm('저장된 매물을 모두 지울까요?')){S.records=[];persist();toast('초기화했어요.','ok');go('home');}">데이터 초기화</button></div>
  </div>`;
}

/* ---- 구독 ---- */
function Subscription(){
  return `<div class="stack">
    <div style="padding:0 4px"><h2 class="sec">구독 요금제</h2><p class="muted" style="font-size:13px; margin-top:2px">지금은 결제 없이 체험할 수 있어요. 요금과 사용량은 추후 관리자 설정에서 변경됩니다.</p></div>
    ${PLANS.map(([nm,pr,q,fe,hot])=>`<div class="plan ${hot?"hot":""}">
      <div class="top"><div style="display:flex; align-items:center; gap:8px"><span class="nm">${nm}</span>${hot?'<span class="badge-hot">인기</span>':""}</div><div class="pr">${pr.toLocaleString()}<small>원/월</small></div></div>
      <div class="q">${q}</div>
      <ul>${fe.map(f=>`<li><span class="ck">✓</span> ${f}</li>`).join("")}</ul>
      <button class="disabled">준비 중 (결제 비활성화)</button>
    </div>`).join("")}
  </div>`;
}

render();
</script>
